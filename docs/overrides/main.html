{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page %}
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page.meta.title | default(page.title) | e }} – {{ config.site_name | e }}" />
  <meta property="og:description" content="{{ page.meta.description | default(config.site_description) }}" />
  <meta property="og:image" content="{{ config.site_url }}assets/eve-social-preview.png" />
  <meta property="og:url" content="{{ page.canonical_url }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page.meta.title | default(page.title) | e }} – {{ config.site_name | e }}" />
  <meta name="twitter:description" content="{{ page.meta.description | default(config.site_description) }}" />
  <meta name="twitter:image" content="{{ config.site_url }}assets/eve-social-preview.png" />
  {% endif %}
{% endblock %}
