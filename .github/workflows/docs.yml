name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Pull request runs never publish, so they get an isolated per-pull-request group.
# A single shared "pages" group would let each newly queued run cancel the previous
# pending one, leaving the required "Build documentation" check permanently unreported.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('docs-pr-{0}', github.event.pull_request.number)
    || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    name: Build documentation
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Test documentation scripts
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore

      - name: Build release assembly
        run: dotnet build --configuration Release --no-restore

      - name: Generate development API documentation
        shell: pwsh
        run: ./scripts/generate-api-docs.ps1 -OutputDirectory docs/api/dev

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Upload documentation site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Download documentation site
        uses: actions/download-artifact@v8
        with:
          name: documentation-site
          path: site

      - name: Checkout published documentation
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: existing-site

      - name: Merge development documentation
        run: >-
          python scripts/merge_docs_site.py
          --incoming site
          --existing existing-site
          --output merged-site
          --mode main

      - name: Persist merged documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: merged-site
          keep_files: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: merged-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
